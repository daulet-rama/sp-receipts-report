<title>Отчёт по чекам</title>
<style>
:root{--bg:#f5f5f4;--fg:#1c1917;--mut:#78716c;--line:#d6d3d1;--card:#fff;--acc:#1c1917;--accfg:#fff;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#0c0a09;--fg:#f5f5f4;--mut:#a8a29e;--line:#44403c;--card:#1c1917;--acc:#f5f5f4;--accfg:#1c1917;--bad:#fca5a5}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
h1{font-size:20px;margin:0 0 4px}
p{margin:0 0 16px;color:var(--mut)}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
button{width:100%;margin-top:12px;font:inherit;font-weight:600;padding:10px;border:0;border-radius:10px;background:var(--acc);color:var(--accfg);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#err{color:var(--bad);min-height:1.5em;margin:12px 0 0}
small{color:var(--mut)}
</style>
<form id="f">
  <h1>Отчёт по чекам</h1>
  <p>Введите пароль, чтобы открыть отчёт.</p>
  <input id="p" type="password" autocomplete="current-password" autofocus required>
  <button id="b">Открыть</button>

</form>

const b64 = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
async function decrypt(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name: "PBKDF2", salt: b64(D.salt), iterations: D.iter, hash: "SHA-256"},
    base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(D.iv)}, key, b64(D.ct));
  return new TextDecoder().decode(plain);
}
function show(html) { document.open(); document.write(html); document.close(); }
async function tryOpen(pw, remember) {
  const html = await decrypt(pw);
  if (remember) { try { sessionStorage.setItem("rp", pw); } catch (e) {} }
  show(html);
}
(async () => {
  let saved = null;
  try { saved = sessionStorage.getItem("rp"); } catch (e) {}
  if (saved) { try { await tryOpen(saved, false); return; } catch (e) { try { sessionStorage.removeItem("rp"); } catch (e2) {} } }
})();
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const btn = document.getElementById("b"), err = document.getElementById("err");
  btn.disabled = true; err.textContent = "";
  try { await tryOpen(document.getElementById("p").value, true); }
  catch (e) { err.textContent = "Неверный пароль"; btn.disabled = false; }
});
